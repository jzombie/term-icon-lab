name: matrix

# term-icon verification pipeline:
#   quality gate → {macos, windows, linux} capture+assert jobs → manifest
#   drift-check (AND gate across platforms).
#
# A glyph enters src/generated_manifest.rs only if its verdict is `pass` in
# every platform job simultaneously.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Runner jobs stay root-scoped read-only; only the manifest job may push
# branches and open the assets PR.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (synthetic fixtures carry pipeline logic)
        run: cargo test --workspace
      - name: Feature build (ratatui)
        run: cargo test -p term-icon --features ratatui

  linux:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install terminal + capture stack (DejaVu explicit — bitmap-font
          fallback would blind every non-ASCII candidate)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xterm imagemagick fonts-dejavu-core
      - name: Build tools
        run: cargo build -p matrix-harness -p pixel-assert
      - name: Run verification matrix
        run: ./scripts/capture-linux.sh target/matrix
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-linux
          path: |
            target/matrix/verdicts.json
            target/matrix/artifacts/sidecar.json
            target/matrix/artifacts/pass1.json
            target/matrix/pages/

  macos:
    runs-on: macos-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tools
        run: cargo build -p matrix-harness -p pixel-assert
      # No TCC mutation: runner images pre-provision ScreenCapture grants for
      # the invoking shell; screencapture -x targets the Terminal.app window.
      - name: Run verification matrix
        run: ./scripts/capture-macos.sh target/matrix
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-macos
          path: |
            target/matrix/verdicts.json
            target/matrix/artifacts/sidecar.json
            target/matrix/artifacts/pass1.json
            target/matrix/pages/

  windows:
    runs-on: windows-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tools
        run: cargo build -p matrix-harness -p pixel-assert
      # Routing inside the script: conhost+GDI backend by default
      # (sidecar-tagged host=conhost); wt/DWM-composed path behind
      # TERM_ICON_WT_EXPERIMENTAL=1 with automatic fallback.
      # shell=powershell (5.1): System.Drawing is builtin there; pwsh 7
      # requires extra assembly references.
      - name: Run verification matrix
        shell: powershell
        run: ./scripts/capture-windows.ps1 -OutDir target/matrix
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-windows
          path: |
            target/matrix/verdicts.json
            target/matrix/artifacts/sidecar.json
            target/matrix/artifacts/pass1.json
            target/matrix/pages/

  manifest:
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Regenerate manifest through the AND gate
        run: |
          cargo run -q -p manifest-gen -- \
            --previous src/generated_manifest.rs \
            --inputs \
              artifacts/verdicts-linux/verdicts.json \
              artifacts/verdicts-macos/verdicts.json \
              artifacts/verdicts-windows/verdicts.json \
            --out /tmp/generated_manifest.rs
      # Downstream of regeneration on purpose: the grids visualize exactly the
      # set this run's gate produced (/tmp/generated_manifest.rs), so a drift
      # failure later cannot desync them from the verified truth.
      - name: Generate platform preview grids
        run: |
          mkdir -p assets
          cargo run -q -p pixel-assert -- \
            --export-grid assets \
            --grid-manifest /tmp/generated_manifest.rs \
            --grid-input linux=artifacts/verdicts-linux \
            --grid-input macos=artifacts/verdicts-macos \
            --grid-input windows=artifacts/verdicts-windows \
            --grid-ucd crates/manifest-gen/ucd/UnicodeData.txt
      # Any pushed branch gets the grids committed straight onto itself so
      # the rendered README/GALLERY can be previewed at that ref without a
      # PR round-trip. Deterministic output + [skip ci] make this a no-op on
      # the retrigger, so the loop always terminates.
      - name: Commit preview grids to branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
        run: |
          git config user.name "term-icon-ci"
          git config user.email "term-icon-ci@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "assets unchanged — nothing to commit"
          else
            git commit -m "chore(assets): update platform grid previews [skip ci]"
            git push
          fi
      - name: Drift check (committed manifest must match AND-gate output)
        run: |
          if ! diff -u src/generated_manifest.rs /tmp/generated_manifest.rs; then
            echo "::error::generated_manifest.rs drifted from the verified set."
            echo "Update it locally, commit, and re-run:"
            echo "  cargo run -p manifest-gen -- --inputs <verdicts...> --out src/generated_manifest.rs"
            exit 1
          fi
      - name: Upload regenerated manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated_manifest
          path: /tmp/generated_manifest.rs
      - name: Upload preview grids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-icon-grids
          path: assets/
      - name: Open assets update PR
        # Asset PRs only from main pushes/dispatches; never PR-triggered runs.
        # create-pull-request is a no-op when assets/ matches the base branch.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: chore/update-assets
          add-paths: assets/*
          commit-message: "chore(assets): update platform grid previews"
          title: "chore(assets): update platform grid previews"
          body: |
            Automated platform preview grids from CI matrix execution.
            Review the visual diff and merge. If src/generated_manifest.rs
            also drifted, regenerate it locally per the drift-check output
            before merging.
